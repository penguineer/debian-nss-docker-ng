---
name: Upstream Release Check

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force_version:
        description: "Override upstream version (for testing; leave blank for auto)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check crates.io for new nss-docker-ng release
    runs-on: ubuntu-latest

    outputs:
      update_available: ${{ steps.check.outputs.update_available }}
      current_version: ${{ steps.check.outputs.current_version }}
      upstream_version: ${{ steps.check.outputs.upstream_version }}
      crate_url: ${{ steps.check.outputs.crate_url }}
      crate_checksum: ${{ steps.check.outputs.crate_checksum }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x ci/check-upstream.sh ci/prepare-update.sh ci/tests/test-check-upstream.sh

      - name: Run unit tests for check-upstream
        run: bash ci/tests/test-check-upstream.sh

      - name: Check crates.io for updates
        id: check
        run: |
          set -euo pipefail
          OUTPUT=$(bash ci/check-upstream.sh)
          echo "$OUTPUT"
          while IFS='=' read -r key val; do
            echo "${key}=${val}" >> "$GITHUB_OUTPUT"
          done <<< "$OUTPUT"

      - name: Log result
        run: |
          echo "Current version:  ${{ steps.check.outputs.current_version }}"
          echo "Upstream version: ${{ steps.check.outputs.upstream_version }}"
          echo "Update available: ${{ steps.check.outputs.update_available }}"

  prepare:
    name: Prepare update PR
    needs: check
    if: needs.check.outputs.update_available == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_version != '')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x ci/prepare-update.sh ci/check-upstream.sh

      - name: Determine target version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.force_version }}" ]; then
            # workflow_dispatch override: use the specified version directly.
            # Construct the crate URL and fetch the checksum from crates.io.
            NEW_VER="${{ github.event.inputs.force_version }}"
            CRATE_URL="https://static.crates.io/crates/nss-docker-ng/${NEW_VER}/download"
            CRATE_CHECKSUM=$(curl --silent --fail \
              --max-time 30 \
              --user-agent "debian-nss-docker-ng-updater/1 (https://github.com/penguineer/debian-nss-docker-ng)" \
              "https://crates.io/api/v1/crates/nss-docker-ng/versions" | \
              jq -r --arg ver "$NEW_VER" '.versions | map(select(.num == $ver)) | first | .checksum')
            CURRENT_VER=$(head -1 debian/changelog | grep -oP '\(\K[^)]+' | sed 's/-[0-9]*$//')
          else
            NEW_VER="${{ needs.check.outputs.upstream_version }}"
            CRATE_URL="${{ needs.check.outputs.crate_url }}"
            CRATE_CHECKSUM="${{ needs.check.outputs.crate_checksum }}"
            CURRENT_VER="${{ needs.check.outputs.current_version }}"
          fi
          echo "new_version=${NEW_VER}" >> "$GITHUB_OUTPUT"
          echo "crate_url=${CRATE_URL}" >> "$GITHUB_OUTPUT"
          echo "crate_checksum=${CRATE_CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "current_version=${CURRENT_VER}" >> "$GITHUB_OUTPUT"

      - name: Check for existing update PR
        id: pr_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW_VER="${{ steps.version.outputs.new_version }}"
          EXISTING=$(gh pr list \
            --state open \
            --search "nss-docker-ng ${NEW_VER} in:title" \
            --json number,title \
            --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for $NEW_VER — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing PR for $NEW_VER"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.pr_check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install devscripts (dch)
        if: steps.pr_check.outputs.skip != 'true'
        run: sudo apt-get install -y devscripts

      - name: Prepare update branch
        if: steps.pr_check.outputs.skip != 'true'
        id: prepare
        env:
          DEBEMAIL: "github-actions[bot]@users.noreply.github.com"
          DEBFULLNAME: "github-actions[bot]"
        run: |
          set -euo pipefail
          NEW_VER="${{ steps.version.outputs.new_version }}"
          BRANCH="upstream-update/${NEW_VER}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and switch to update branch
          git checkout -b "$BRANCH"

          # Run the update logic; capture last line for DRAFT_PR flag
          PREPARE_OUTPUT=$(bash ci/prepare-update.sh \
            "$NEW_VER" \
            "${{ steps.version.outputs.crate_url }}" \
            "${{ steps.version.outputs.crate_checksum }}")
          echo "$PREPARE_OUTPUT"

          DRAFT_PR=$(echo "$PREPARE_OUTPUT" | grep '^DRAFT_PR=' | cut -d= -f2 | tail -1)
          echo "draft_pr=${DRAFT_PR}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          # Stage and commit all changes
          git add -A
          git commit -m "chore: update nss-docker-ng to ${NEW_VER}"

      - name: Push update branch
        if: steps.pr_check.outputs.skip != 'true'
        run: |
          git push origin "${{ steps.prepare.outputs.branch }}"

      - name: Fetch upstream release notes URL
        if: steps.pr_check.outputs.skip != 'true'
        id: release_notes
        run: |
          NEW_VER="${{ steps.version.outputs.new_version }}"
          CRATES_URL="https://crates.io/crates/nss-docker-ng/${NEW_VER}"
          GH_URL="https://github.com/petski/nss-docker-ng/releases/tag/v${NEW_VER}"
          echo "crates_url=${CRATES_URL}" >> "$GITHUB_OUTPUT"
          echo "gh_url=${GH_URL}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.pr_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW_VER="${{ steps.version.outputs.new_version }}"
          CURRENT_VER="${{ steps.version.outputs.current_version }}"
          BRANCH="${{ steps.prepare.outputs.branch }}"
          DRAFT="${{ steps.prepare.outputs.draft_pr }}"
          CRATE_URL="${{ steps.version.outputs.crate_url }}"
          CRATES_PAGE="${{ steps.release_notes.outputs.crates_url }}"
          GH_RELEASE="${{ steps.release_notes.outputs.gh_url }}"

          DRAFT_FLAG=""
          DRAFT_NOTE=""
          if [ "$DRAFT" = "true" ]; then
            DRAFT_FLAG="--draft"
            DRAFT_NOTE=$'\n\n> **⚠️ DRAFT:** The Trixie/MSRV quilt patch requires human review before this PR can be merged. See prepare-update output above.'
          fi

          PR_BODY="## Upstream release: nss-docker-ng ${NEW_VER}

          | Field | Value |
          |-------|-------|
          | Previous upstream version | \`${CURRENT_VER}\` |
          | New upstream version | \`${NEW_VER}\` |
          | Crate archive URL | [download](${CRATE_URL}) |
          | crates.io page | [${CRATES_PAGE}](${CRATES_PAGE}) |
          | GitHub release | [v${NEW_VER}](${GH_RELEASE}) |

          ### What changed

          - \`Cargo.toml\` and \`Cargo.lock\` updated from upstream crate.
          - \`vendor.tar.gz\` regenerated from the final patched dependency state.
          - \`debian/changelog\` bumped to \`${NEW_VER}-1\`.
          - Trixie/MSRV quilt patch re-evaluated (see CI output).

          ### Review checklist

          - [ ] Upstream release notes reviewed
          - [ ] Dependency changes acceptable
          - [ ] Quilt patch status confirmed (applied / updated / dropped)
          - [ ] CI passes
          - [ ] Package installs and smoke test passes${DRAFT_NOTE}

          ---
          *This PR was created automatically by the upstream-release-check workflow.*"

          gh pr create \
            --title "chore: update nss-docker-ng to ${NEW_VER}" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH" \
            --label "upstream-update" \
            $DRAFT_FLAG \
            || gh pr create \
              --title "chore: update nss-docker-ng to ${NEW_VER}" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH" \
              $DRAFT_FLAG

  run-ci-on-update-branch:
    name: Run package CI on update branch
    needs: [check, prepare]
    if: needs.check.outputs.update_available == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_version != '')
    uses: ./.github/workflows/ci.yml
    # The PR branch was just pushed; ci.yml listens on pull_request but
    # GITHUB_TOKEN PRs don't trigger pull_request events from Actions.
    # We therefore call ci.yml explicitly as a reusable workflow on the
    # update branch so the same checks run before the PR can be merged.
    secrets: inherit
