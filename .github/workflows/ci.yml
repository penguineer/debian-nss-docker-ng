---
name: Debian Package CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, check, install and smoke-test on Debian Trixie
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 1. Build the Debian package in a clean Trixie container.           #
      #    dpkg-buildpackage writes artefacts one level above the source   #
      #    tree.  We mount the workspace parent so those files land on the  #
      #    runner filesystem and are accessible to later steps.            #
      # ------------------------------------------------------------------ #
      - name: Build Debian package (Debian Trixie)
        run: |
          PARENT=$(dirname "${{ github.workspace }}")
          SRCDIR=$(basename "${{ github.workspace }}")
          docker run --rm \
            --volume "$PARENT":/build \
            --workdir "/build/$SRCDIR" \
            debian:trixie \
            bash "ci/build-package.sh"

      # ------------------------------------------------------------------ #
      # 2. Lintian + package-contents checks                               #
      # ------------------------------------------------------------------ #
      - name: Check package (lintian + contents)
        run: |
          ARTIFACTS=$(dirname "${{ github.workspace }}")
          docker run --rm \
            --volume "$ARTIFACTS":/artifacts \
            --volume "${{ github.workspace }}/ci":/ci:ro \
            debian:trixie \
            bash /ci/check-package.sh /artifacts

      # ------------------------------------------------------------------ #
      # 3. Install / removal lifecycle test                                 #
      # ------------------------------------------------------------------ #
      - name: NSS lifecycle test (install + remove)
        run: |
          ARTIFACTS=$(dirname "${{ github.workspace }}")
          docker run --rm \
            --volume "$ARTIFACTS":/artifacts \
            --volume "${{ github.workspace }}/ci":/ci:ro \
            debian:trixie \
            bash /ci/test-lifecycle.sh /artifacts

      # ------------------------------------------------------------------ #
      # 4. End-to-end Docker / NSS smoke test                              #
      # ------------------------------------------------------------------ #
      - name: Docker NSS smoke test
        run: |
          ARTIFACTS=$(dirname "${{ github.workspace }}")

          # Unique name avoids collisions between concurrent CI runs.
          TEST_NAME="nss-test-${{ github.run_id }}-${{ github.run_attempt }}"

          # Register cleanup before starting the container so it always runs.
          cleanup() {
            echo "=== Cleaning up test container ==="
            docker rm -f "$TEST_NAME" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "=== Starting test container: $TEST_NAME ==="
          docker run -d --name "$TEST_NAME" alpine sleep 300

          CONTAINER_IP=$(docker inspect \
            -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
            "$TEST_NAME")
          echo "Container IP: $CONTAINER_IP"

          echo ""
          echo "=== Running NSS smoke test in Debian Trixie ==="

          # Mount the host Docker socket so the NSS module can reach the
          # daemon.  --privileged is NOT used.
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$ARTIFACTS":/artifacts \
            --volume "${{ github.workspace }}/ci":/ci:ro \
            debian:trixie \
            bash /ci/smoke-test-nss.sh /artifacts "$TEST_NAME" "$CONTAINER_IP"

